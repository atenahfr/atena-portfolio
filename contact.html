  <section id="contact" class="contact-channel">
  <div class="container">
    <h2 data-reveal="up">Contact</h2>

    <p class="channel-status" data-reveal="up">
      <span class="channel-status__dot"></span>
      <span class="channel-status__text">AWAITING TRANSMISSION...</span>
    </p>

    <form class="glass contact-form" data-reveal="up" action="https://formspree.io/f/mykrbbzg" method="POST">
      <input type="text" name="name" placeholder="Your name" required />
      <input type="email" name="email" placeholder="Your email" required />
      <textarea name="message" placeholder="Message" rows="4" required></textarea>
      <div class="magnetic-wrap">
        <button type="submit" class="btn-primary magnetic">Send &rarr;</button>
      </div>
    </form>

    <p style="margin-top:20px; color:var(--text-secondary); font-size:14px;">atenah.cs@gmail.com</p>
  </div>
</section>

  <footer id="site-footer">
    <div class="container">
      <span>&copy; Atena Hosseinifar</span>
      <div class="footer-links">
        <a href="https://linkedin.com/in/atena-hosseinifar" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/atenahfr" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>
